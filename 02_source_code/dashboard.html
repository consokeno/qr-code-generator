{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Dashboard</h2>
    <a href="{{ url_for('create') }}" class="btn btn-success">New QR Code</a>
</div>
<form method="GET" class="mb-3">
    <input type="text" name="search" class="form-control" placeholder="Search by title" value="{{ request.args.get('search', '') }}">
</form>
<table class="table table-striped">
    <thead>
        <tr><th>Title</th><th>Type</th><th>Status</th><th>Actions</th></tr>
    </thead>
    <tbody>
        {% for qr in qrs %}
        <tr>
            <td>{{ qr.title }}</td>
            <td>{{ qr.qr_type }}</td>
            <td>{{ qr.status }}</td>
            <td>
                <a href="{{ url_for('view_qr', id=qr.id) }}" class="btn btn-sm btn-primary">View</a>
                <a href="{{ url_for('delete', id=qr.id) }}" class="btn btn-sm btn-danger">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
